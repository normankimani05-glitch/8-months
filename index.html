<style>
html,body{height:100%;margin:0}
body{background:#020308;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#c9d3df;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}

<body>
<a class="qr" id="link" href="flower.html" aria-label="QR code that opens the flower"><svg id="qr" viewBox="0 0 10 10" shape-rendering="crispEdges"></svg></a>
<p>Scan with your phone camera to open me to just touch</p>
<script>
(function(){
function QR(text){
var data=Array.prototype.slice.call(new TextEncoder().encode(text));
var ECC=[10,16,26,18,24,16,18,22,22,26],BLK=[1,1,1,2,2,4,4,4,5,5];
function raw(v){var r=(16*v+128)*v+64;if(v>=2){var n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
var ver,cap;
for(ver=1;ver<=10;ver++){cap=Math.floor(raw(ver)/8)-ECC[ver-1]*BLK[ver-1];if(data.length+(ver<10?2:3)<=cap)break}
if(ver>10)throw new Error("too long");
var bits=[];function put(v,n){for(var i=n-1;i>=0;i--)bits.push((v>>>i)&1)}
put(4,4);put(data.length,ver<10?8:16);data.forEach(function(b){put(b,8)});
var cb=cap*8;put(0,Math.min(4,cb-bits.length));while(bits.length%8)bits.push(0);
var cw=[],i,j;for(i=0;i<bits.length;i+=8){var b=0;for(j=0;j<8;j++)b=b<<1|bits[i+j];cw.push(b)}
for(var pad=0xEC;cw.length<cap;pad^=0xEC^0x11)cw.push(pad);
function mul(x,y){var z=0;for(var k=7;k>=0;k--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>k)&1)*x}return z}
var eccLen=ECC[ver-1],nb=BLK[ver-1],div=[];for(i=0;i<eccLen-1;i++)div.push(0);div.push(1);
var root=1;for(i=0;i<eccLen;i++){for(j=0;j<div.length;j++){div[j]=mul(div[j],root);if(j+1<div.length)div[j]^=div[j+1]}root=mul(root,2)}
function rem(d){var r=div.map(function(){return 0});d.forEach(function(x){var f=x^r.shift();r.push(0);div.forEach(function(c,k){r[k]^=mul(c,f)})});return r}
var rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),blocks=[],k=0;
for(i=0;i<nb;i++){var dl=sl-eccLen+(i<ns?0:1),dat=cw.slice(k,k+dl);k+=dl;var e=rem(dat);if(i<ns)dat.push(0);blocks.push(dat.concat(e))}
var all=[];for(i=0;i<blocks[0].length;i++)for(j=0;j<nb;j++)if(i!=sl-eccLen||j>=ns)all.push(blocks[j][i]);
var size=ver*4+17,M=[],F=[];for(i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
function fn(x,y,v){M[y][x]=v;F[y][x]=true}
for(i=0;i<size;i++){fn(6,i,i%2==0);fn(i,6,i%2==0)}
function finder(x,y){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)fn(xx,yy,d!=2&&d!=4)}}
finder(3,3);finder(size-4,3);finder(3,size-4);
var pos=[];if(ver>1){var na=Math.floor(ver/7)+2,st=ver==32?26:Math.ceil((ver*4+4)/(na*2-2))*2;pos=[6];for(var p=size-7;pos.length<na;p-=st)pos.splice(1,0,p);
pos.forEach(function(a,ai){pos.forEach(function(b,bi){if((ai==0&&bi==0)||(ai==0&&bi==na-1)||(ai==na-1&&bi==0))return;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)fn(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)})})}
function fmt(mask){var d=0<<3|mask,r=d;for(var q=0;q<10;q++)r=(r<<1)^((r>>>9)*0x537);var bb=(d<<10|r)^0x5412;function g(n){return((bb>>>n)&1)!=0}
for(var q=0;q<=5;q++)fn(8,q,g(q));fn(8,7,g(6));fn(8,8,g(7));fn(7,8,g(8));for(q=9;q<15;q++)fn(14-q,8,g(q));
for(q=0;q<8;q++)fn(size-1-q,8,g(q));for(q=8;q<15;q++)fn(8,size-15+q,g(q));fn(8,size-8,true)}
fmt(0);
if(ver>=7){var rr=ver;for(i=0;i<12;i++)rr=(rr<<1)^((rr>>>11)*0x1F25);var vb=ver<<12|rr;for(i=0;i<18;i++){var bt=((vb>>>i)&1)!=0,a=size-11+i%3,b2=Math.floor(i/3);fn(a,b2,bt);fn(b2,a,bt)}}
var n=0;for(var right=size-1;right>=1;right-=2){if(right==6)right=5;for(var vert=0;vert<size;vert++)for(j=0;j<2;j++){var x=right-j,up=((right+1)&2)==0,y=up?size-1-vert:vert;if(!F[y][x]&&n<all.length*8){M[y][x]=((all[n>>>3]>>>(7-(n&7)))&1)!=0;n++}}}
function mask(m){for(var y=0;y<size;y++)for(var x=0;x<size;x++){var inv;switch(m){case 0:inv=(x+y)%2==0;break;case 1:inv=y%2==0;break;case 2:inv=x%3==0;break;case 3:inv=(x+y)%3==0;break;case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2==0;break;case 5:inv=x*y%2+x*y%3==0;break;case 6:inv=(x*y%2+x*y%3)%2==0;break;default:inv=((x+y)%2+x*y%3)%2==0}if(!F[y][x]&&inv)M[y][x]=!M[y][x]}}
function pen(){var s=0,y,x,run;for(var t=0;t<2;t++)for(y=0;y<size;y++){run=1;for(x=1;x<size;x++){var a=t?M[x][y]:M[y][x],c=t?M[x-1][y]:M[y][x-1];if(a==c){run++;if(run==5)s+=3;else if(run>5)s++}else run=1}}
for(y=0;y<size-1;y++)for(x=0;x<size-1;x++)if(M[y][x]==M[y][x+1]&&M[y][x]==M[y+1][x]&&M[y][x]==M[y+1][x+1])s+=3;return s}
var best=0,bp=1e9;for(var m=0;m<8;m++){mask(m);fmt(m);var pp=pen();if(pp<bp){bp=pp;best=m}mask(m)}
mask(best);fmt(best);return M}
var url=new URL("flower.html",location.href).href,M=QR(url),n=M.length,q=4,s="";
for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(M[y][x])s+="M"+(x+q)+","+(y+q)+"h1v1h-1z";
var svg=document.getElementById("qr");svg.setAttribute("viewBox","0 0 "+(n+q*2)+" "+(n+q*2));
svg.innerHTML='<rect width="100%" height="100%" fill="#fff"/><path d="'+s+'" fill="#131b23"/>';
document.getElementById("link").href=url;
})();
</script>
